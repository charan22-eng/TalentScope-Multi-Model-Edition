name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-lint-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
    - name: Install dependencies
      run: |
        uv venv .venv
        uv pip install -r backend/requirements.txt -e ml
        uv pip install ruff black pytest
        
    - name: Lint
      run: |
        uv run ruff check .
        uv run black --check .
        
    - name: Test
      run: |
        uv run pytest -q ml/tests backend/tests

  frontend-lint-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      working-directory: frontend
      run: npm install
      
    - name: Lint
      working-directory: frontend
      run: npm run lint
      
    - name: Test
      working-directory: frontend
      run: npm run test -- --run
