[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "charanrao" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.13,<2",
    "bcrypt>=4,<5",
    "fastapi>=0.100,<1",
    "httpx>=0.24,<1",
    "joblib>=1.3,<2",
    "numpy>=1.24,<2",
    "pandas>=2,<3",
    "passlib>=1.7,<2",
    "psycopg[binary]>=3,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-jose[cryptography]>=3.3,<4",
    "python-multipart>=0.0.6,<1",
    "reportlab>=4,<5",
    "scikit-learn==1.2.2",
    "scipy>=1.10,<2",
    "slowapi>=0.1,<1",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.23,<1",
    "pytest>=7,<9",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
